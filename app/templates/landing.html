<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Automation & Deep Learning Medical Screening Systems.">
    <title>AI Automation Systems — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=10">
</head>
<body class="landing-body">
    <!-- Fixed Background Video (behind everything) -->
    <video class="bg-video-fixed" autoplay muted loop playsinline>
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260514_135830_bb6491d1-9b66-4aec-9722-13b4dfe3fb46.mp4" type="video/mp4">
    </video>
    <div class="video-overlay-gradient"></div>

    <!-- Header -->
    <header class="app-header header-dark">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" stroke="url(#logoGradientDark)" stroke-width="2.5" fill="none"/>
                        <path d="M14 20h12M20 14v12" stroke="url(#logoGradientDark)" stroke-width="2.5" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="logoGradientDark" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#6c5ce7"/>
                                <stop offset="100%" stop-color="#00cec9"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>AI Automation</h1>
                    <span class="logo-subtitle">Systems & Diagnostics</span>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/" class="nav-link active">Home</a>
                <a href="/detect" class="nav-link nav-btn-highlight">Cancer Detection →</a>
            </nav>
        </div>
    </header>

    <!-- Full Viewport Landing Hero Section (100vh over fixed video) -->
    <main class="video-hero-viewport">
        <div class="hero-content-block">
            <h2 class="hero-staggered-heading">
                <span class="fade-up-word" style="--word-delay: 0.15s;">WE</span>
                <span class="fade-up-word" style="--word-delay: 0.23s;">BUILD</span>
                <span class="fade-up-word" style="--word-delay: 0.31s;">END-TO-END</span>
                <span class="fade-up-word" style="--word-delay: 0.39s;">AI</span>
                <span class="fade-up-word" style="--word-delay: 0.47s;">AUTOMATION</span>
                <span class="fade-up-word" style="--word-delay: 0.55s;">SYSTEMS.</span>
            </h2>
            <p class="hero-subtext-animated" style="--subtext-delay: 0.9s;">
                We provide all-in-one AI automation services in one place.
            </p>
            <div class="hero-cta-wrapper" style="--cta-delay: 1.05s;">
                <a href="/detect" class="hero-cta-btn">
                    <span>Enter Cancer Detection System</span>
                    <svg viewBox="0 0 20 20" fill="currentColor" class="cta-icon">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
